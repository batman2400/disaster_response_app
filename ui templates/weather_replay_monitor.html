<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Replay - Smart NDRRMS</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        brand: {
                            blue: '#2563eb', 
                            indigo: '#4f46e5',
                            cyan: '#06b6d4',
                            light: '#eff6ff',
                        },
                        status: {
                            emerald: '#10b981',
                            emeraldBg: '#ecfdf5',
                            crimson: '#e11d48',
                            crimsonBg: '#ffe4e6',
                            amber: '#f59e0b',
                            amberBg: '#fffbeb',
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'glow-cyan': '0 0 25px rgba(6, 182, 212, 0.4)',
                        'glow-red': '0 0 25px rgba(225, 29, 72, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        #app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 420px) {
            #app-container {
                height: 92vh;
                border-radius: 44px;
                border: 8px solid #0f172a;
            }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Colorful Ambient Background Orbs (Weather Theme) */
        .ambient-orb-1 {
            position: absolute;
            top: -100px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, rgba(6,182,212,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .ambient-orb-2 {
            position: absolute;
            top: 30%;
            right: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(37,99,235,0.12) 0%, rgba(37,99,235,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* Stream Item Animations */
        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .stream-item-enter { animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Pulse for critical metrics */
        @keyframes urgentPulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .animate-urgent-pulse { animation: urgentPulse 1.5s infinite; }
        
        /* Bar transitions */
        .metric-bar { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .metric-value { transition: color 0.5s ease; }
    </style>
</head>
<body class="antialiased text-slate-800">

    <div id="app-container">
        
        <!-- Ambient Colorful Background -->
        <div class="ambient-orb-1"></div>
        <div class="ambient-orb-2"></div>

        <!-- Status Bar Mockup -->
        <div class="flex justify-between items-center px-6 pt-4 pb-2 text-xs font-bold text-slate-900 bg-transparent z-30 relative">
            <span id="clock">12:21</span>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Glass Header -->
        <div class="px-6 py-4 flex items-center justify-between sticky top-0 z-20 bg-white/60 backdrop-blur-xl border-b border-white/20">
            <button class="w-10 h-10 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center justify-center text-slate-600 active:scale-90 transition-transform">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="text-center">
                <h1 class="text-lg font-extrabold tracking-tight text-slate-900">Simulation Control</h1>
                <p class="text-[10px] font-bold text-brand-cyan uppercase tracking-widest mt-0.5">Automated Feeds</p>
            </div>
            <div class="w-10 h-10 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center justify-center text-slate-600">
                <i class="fa-solid fa-server"></i>
            </div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto no-scrollbar relative z-10 flex flex-col px-6 pt-4 pb-10">
            
            <!-- Replay Controls Card -->
            <div class="bg-white/80 backdrop-blur-md rounded-[24px] p-5 shadow-soft border border-slate-100 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="font-extrabold text-slate-900 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-clock-rotate-left text-brand-blue"></i> rainy-day-replay.ts
                        </h2>
                        <p class="text-[10px] font-semibold text-slate-500 mt-0.5">Mocking telemetry over 4 hours</p>
                    </div>
                    <span id="sim-status-badge" class="bg-slate-100 text-slate-500 text-[9px] font-bold px-2 py-1 rounded-md uppercase tracking-widest">Idle</span>
                </div>
                
                <!-- Playback Timeline -->
                <div class="relative w-full h-2 bg-slate-100 rounded-full mb-4 overflow-hidden">
                    <div id="sim-progress" class="absolute left-0 top-0 h-full bg-brand-cyan rounded-full w-0 transition-all duration-[1000ms] ease-linear"></div>
                </div>
                <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-5 font-mono">
                    <span id="time-current">14:00</span>
                    <span id="time-end">18:00</span>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3">
                    <button id="btn-play" onclick="startSimulation()" class="flex-1 py-3 bg-gradient-to-r from-brand-blue to-brand-cyan text-white font-bold text-sm rounded-xl shadow-glow-cyan active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> Start Feed
                    </button>
                    <button id="btn-reset" onclick="resetSimulation()" class="px-5 py-3 bg-white border border-slate-200 text-slate-600 font-bold text-sm rounded-xl active:scale-[0.98] transition-all disabled:opacity-50" disabled>
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-3">Live Sensor Telemetry</h2>
            
            <div class="grid grid-cols-2 gap-3 mb-8">
                <!-- Rainfall Gauge -->
                <div id="card-rain" class="bg-white/90 backdrop-blur-md rounded-[20px] p-4 shadow-soft border border-slate-100 transition-colors duration-300 relative overflow-hidden">
                    <div class="flex justify-between items-start mb-2">
                        <div class="w-8 h-8 rounded-full bg-brand-light text-brand-blue flex items-center justify-center text-sm">
                            <i class="fa-solid fa-cloud-rain"></i>
                        </div>
                        <span class="text-[9px] font-bold text-slate-400">Ward 07</span>
                    </div>
                    <div class="mt-2">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Rainfall</span>
                        <div class="flex items-end gap-1 mt-0.5">
                            <span id="val-rain" class="font-mono text-2xl font-extrabold text-slate-700 metric-value">12</span>
                            <span class="text-xs font-bold text-slate-400 mb-1">mm/hr</span>
                        </div>
                    </div>
                    <!-- Threshold bar -->
                    <div class="w-full h-1 bg-slate-100 rounded-full mt-3 relative">
                        <div class="absolute left-[40%] top-0 bottom-0 w-[2px] bg-status-crimson z-10"></div> <!-- 40mm threshold marker -->
                        <div id="bar-rain" class="h-full bg-status-emerald rounded-full metric-bar w-[12%]"></div>
                    </div>
                </div>

                <!-- River Level Gauge -->
                <div id="card-river" class="bg-white/90 backdrop-blur-md rounded-[20px] p-4 shadow-soft border border-slate-100 transition-colors duration-300 relative overflow-hidden">
                    <div class="flex justify-between items-start mb-2">
                        <div class="w-8 h-8 rounded-full bg-brand-light text-brand-blue flex items-center justify-center text-sm">
                            <i class="fa-solid fa-water"></i>
                        </div>
                        <span class="text-[9px] font-bold text-slate-400">Ward 07</span>
                    </div>
                    <div class="mt-2">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">River Lvl</span>
                        <div class="flex items-end gap-1 mt-0.5">
                            <span id="val-river" class="font-mono text-2xl font-extrabold text-slate-700 metric-value">45</span>
                            <span class="text-xs font-bold text-slate-400 mb-1">%</span>
                        </div>
                    </div>
                    <!-- Threshold bar -->
                    <div class="w-full h-1 bg-slate-100 rounded-full mt-3 relative">
                        <div class="absolute left-[75%] top-0 bottom-0 w-[2px] bg-status-crimson z-10"></div> <!-- 75% threshold marker -->
                        <div id="bar-river" class="h-full bg-status-emerald rounded-full metric-bar w-[45%]"></div>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-end mb-3">
                <h2 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">System Event Stream</h2>
                <div class="flex items-center gap-1.5">
                    <div id="stream-indicator" class="w-1.5 h-1.5 bg-slate-300 rounded-full"></div>
                    <span id="stream-status" class="text-[9px] font-bold text-slate-400 uppercase">Awaiting Feed</span>
                </div>
            </div>

            <!-- Event Log Container -->
            <div id="event-stream" class="flex flex-col gap-3">
                <!-- Initial static log -->
                <div class="bg-white/60 border border-slate-100 rounded-2xl p-3 flex gap-3 opacity-70">
                    <div class="w-1.5 bg-slate-200 rounded-full shrink-0"></div>
                    <div>
                        <div class="flex gap-2 items-center mb-1">
                            <span class="text-[9px] font-mono text-slate-400">14:00:00</span>
                            <span class="text-[9px] font-bold text-slate-500 uppercase">System</span>
                        </div>
                        <p class="text-xs font-medium text-slate-600">Telemetry feed initialized. Listening for data...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Clock Update
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simulation Data (Mimicking scripts/replay-rainy-day.ts)
        const simData = [
            { time: "14:30", tick: 12, rain: 28, river: 60, status: "WATCH", msg: "Precipitation increasing. Status changed to WATCH.", type: "warn" },
            { time: "15:15", tick: 31, rain: 38, river: 72, status: "WATCH", msg: "Approaching critical thresholds.", type: "warn" },
            { time: "16:00", tick: 50, rain: 45, river: 78, status: "CRITICAL", msg: "THRESHOLD BREACH: Rain > 40mm/hr, River > 75%.", type: "critical" },
            { time: "16:01", tick: 51, rain: 45, river: 78, status: "ALERT", msg: "AUTO-TRIGGER: AREA_ALERT dispatched for Ward 07.", type: "alert" },
            { time: "17:00", tick: 75, rain: 20, river: 80, status: "CRITICAL", msg: "Rainfall decreasing, but river level remains high.", type: "warn" },
            { time: "18:00", tick: 100, rain: 5, river: 65, status: "NORMAL", msg: "Telemetry returning to normal boundaries.", type: "success" }
        ];

        let simInterval;
        let currentTick = 0;
        let isSimRunning = false;

        function startSimulation() {
            if(isSimRunning) return;
            
            isSimRunning = true;
            document.getElementById('btn-play').disabled = true;
            document.getElementById('btn-play').classList.add('opacity-50');
            document.getElementById('btn-reset').disabled = false;
            
            document.getElementById('sim-status-badge').textContent = 'RUNNING';
            document.getElementById('sim-status-badge').className = 'bg-brand-cyan/20 text-brand-cyan text-[9px] font-bold px-2 py-1 rounded-md uppercase tracking-widest animate-pulse';
            
            document.getElementById('stream-indicator').classList.add('bg-status-emerald', 'animate-ping');
            document.getElementById('stream-status').textContent = 'LIVE FEED';
            document.getElementById('stream-status').classList.add('text-status-emerald');

            // Run ticks every 1 second (simulating time passing)
            simInterval = setInterval(() => {
                currentTick++;
                updateProgress(currentTick);
                checkSimEvents(currentTick);

                if(currentTick >= 100) {
                    endSimulation();
                }
            }, 200); // 100 ticks * 200ms = 20 seconds total sim time
        }

        function updateProgress(tick) {
            document.getElementById('sim-progress').style.width = `${tick}%`;
        }

        function checkSimEvents(tick) {
            const event = simData.find(d => d.tick === tick);
            if (event) {
                document.getElementById('time-current').textContent = event.time;
                updateGauges(event.rain, event.river, event.status);
                addLog(event.time, event.msg, event.type);
            }
        }

        function updateGauges(rain, river, status) {
            const valRain = document.getElementById('val-rain');
            const valRiver = document.getElementById('val-river');
            const barRain = document.getElementById('bar-rain');
            const barRiver = document.getElementById('bar-river');
            const cardRain = document.getElementById('card-rain');
            const cardRiver = document.getElementById('card-river');

            // Animate numbers
            valRain.textContent = rain;
            valRiver.textContent = river;
            
            // Widths (cap at 100% for visual logic)
            barRain.style.width = `${Math.min(rain, 100)}%`;
            barRiver.style.width = `${Math.min(river, 100)}%`;

            // Status Styling
            let colorClass = 'text-status-emerald';
            let bgClass = 'bg-status-emerald';
            let cardRing = '';

            if (status === 'WATCH') {
                colorClass = 'text-status-amber';
                bgClass = 'bg-status-amber';
            } else if (status === 'CRITICAL' || status === 'ALERT') {
                colorClass = 'text-status-crimson';
                bgClass = 'bg-status-crimson';
                cardRing = 'ring-2 ring-status-crimson/50 animate-urgent-pulse';
            }

            valRain.className = `font-mono text-2xl font-extrabold metric-value ${colorClass}`;
            valRiver.className = `font-mono text-2xl font-extrabold metric-value ${colorClass}`;
            barRain.className = `h-full rounded-full metric-bar ${bgClass}`;
            barRiver.className = `h-full rounded-full metric-bar ${bgClass}`;
            
            cardRain.className = `bg-white/90 backdrop-blur-md rounded-[20px] p-4 shadow-soft border border-slate-100 transition-all duration-300 relative overflow-hidden ${cardRing}`;
            cardRiver.className = `bg-white/90 backdrop-blur-md rounded-[20px] p-4 shadow-soft border border-slate-100 transition-all duration-300 relative overflow-hidden ${cardRing}`;
        }

        function addLog(time, msg, type) {
            const stream = document.getElementById('event-stream');
            
            let colorBar = 'bg-slate-300';
            let tagColor = 'text-slate-500';
            let tagText = 'SYSTEM';
            
            if (type === 'warn') {
                colorBar = 'bg-status-amber'; tagColor = 'text-status-amber'; tagText = 'WARNING';
            } else if (type === 'critical') {
                colorBar = 'bg-status-crimson'; tagColor = 'text-status-crimson'; tagText = 'BREACH';
            } else if (type === 'alert') {
                colorBar = 'bg-brand-blue'; tagColor = 'text-brand-blue'; tagText = 'ACTION';
            } else if (type === 'success') {
                colorBar = 'bg-status-emerald'; tagColor = 'text-status-emerald'; tagText = 'RESOLVED';
            }

            const html = `
                <div class="bg-white border border-slate-100 rounded-2xl p-3 flex gap-3 shadow-sm stream-item-enter">
                    <div class="w-1.5 ${colorBar} rounded-full shrink-0"></div>
                    <div>
                        <div class="flex gap-2 items-center mb-1">
                            <span class="text-[9px] font-mono text-slate-400">${time}:00</span>
                            <span class="text-[9px] font-bold ${tagColor} uppercase tracking-wider">${tagText}</span>
                        </div>
                        <p class="text-xs font-medium text-slate-700">${msg}</p>
                    </div>
                </div>
            `;
            
            // Insert at top
            stream.insertAdjacentHTML('afterbegin', html);
        }

        function endSimulation() {
            clearInterval(simInterval);
            isSimRunning = false;
            
            document.getElementById('sim-status-badge').textContent = 'COMPLETED';
            document.getElementById('sim-status-badge').className = 'bg-status-emerald/20 text-status-emerald text-[9px] font-bold px-2 py-1 rounded-md uppercase tracking-widest';
            
            document.getElementById('stream-indicator').classList.remove('bg-status-emerald', 'animate-ping');
            document.getElementById('stream-indicator').classList.add('bg-slate-300');
            document.getElementById('stream-status').textContent = 'FEED ENDED';
            document.getElementById('stream-status').classList.replace('text-status-emerald', 'text-slate-400');
        }

        function resetSimulation() {
            clearInterval(simInterval);
            isSimRunning = false;
            currentTick = 0;
            
            document.getElementById('btn-play').disabled = false;
            document.getElementById('btn-play').classList.remove('opacity-50');
            document.getElementById('btn-reset').disabled = true;
            
            document.getElementById('sim-progress').style.width = `0%`;
            document.getElementById('time-current').textContent = '14:00';
            
            document.getElementById('sim-status-badge').textContent = 'IDLE';
            document.getElementById('sim-status-badge').className = 'bg-slate-100 text-slate-500 text-[9px] font-bold px-2 py-1 rounded-md uppercase tracking-widest';
            
            document.getElementById('stream-indicator').classList.remove('bg-status-emerald', 'animate-ping');
            document.getElementById('stream-indicator').classList.add('bg-slate-300');
            document.getElementById('stream-status').textContent = 'AWAITING FEED';
            document.getElementById('stream-status').classList.replace('text-status-emerald', 'text-slate-400');

            updateGauges(12, 45, 'NORMAL');
            
            // Reset logs
            const stream = document.getElementById('event-stream');
            stream.innerHTML = `
                <div class="bg-white/60 border border-slate-100 rounded-2xl p-3 flex gap-3 opacity-70">
                    <div class="w-1.5 bg-slate-200 rounded-full shrink-0"></div>
                    <div>
                        <div class="flex gap-2 items-center mb-1">
                            <span class="text-[9px] font-mono text-slate-400">14:00:00</span>
                            <span class="text-[9px] font-bold text-slate-500 uppercase">System</span>
                        </div>
                        <p class="text-xs font-medium text-slate-600">Telemetry feed initialized. Listening for data...</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
