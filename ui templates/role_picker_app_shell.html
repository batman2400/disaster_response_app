<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDRRMS - Role Picker</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Tailwind Configuration for exact colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#1d4ed8', /* Cobalt Blue */
                            light: '#eff6ff',
                        },
                        status: {
                            emerald: '#10b981',
                            emeraldBg: '#ecfdf5',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth scrolling and tap highlight removal for app feel */
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #e2e8f0; /* Darker background for the browser body to frame the app */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        /* Mobile Simulator Shell */
        #app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #f8fafc; /* Very light slate/gray base as requested */
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @media (min-width: 420px) {
            #app-container {
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #0f172a; /* Simulating phone bezels on desktop */
            }
        }

        /* Hide scrollbar for clean app look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="antialiased text-slate-900">

    <!-- Mobile App Container -->
    <div id="app-container" class="flex flex-col relative">
        
        <!-- Status Bar Mockup -->
        <div class="flex justify-between items-center px-6 pt-4 pb-2 text-xs font-bold text-slate-900">
            <span id="clock">12:21</span>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto no-scrollbar pb-10">
            
            <!-- App Header -->
            <div class="px-6 pt-6 pb-2">
                <div class="w-12 h-12 bg-brand-blue rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-6">
                    <i class="fa-solid fa-shield-halved text-white text-xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">NDRRMS</h1>
                <p class="text-slate-500 font-medium text-sm leading-relaxed">National Disaster Response & Resource Management System</p>
            </div>

            <!-- System Status Banner (Semantic Action Component) -->
            <div class="mx-6 mt-4 mb-8 p-4 bg-status-emeraldBg border border-emerald-100 rounded-2xl flex items-start gap-4">
                <div class="mt-1 relative flex items-center justify-center w-3 h-3">
                    <div class="absolute w-full h-full bg-status-emerald rounded-full opacity-40 animate-ping"></div>
                    <div class="relative w-2 h-2 bg-status-emerald rounded-full"></div>
                </div>
                <div>
                    <h3 class="text-emerald-900 font-bold text-sm">System Live</h3>
                    <p class="text-emerald-700 text-xs font-medium mt-0.5">Connected to Production Environment. Real-time updates active.</p>
                </div>
            </div>

            <!-- Role Selection Section -->
            <div class="px-6">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Select User Role</h2>
                
                <!-- Role Buttons List -->
                <div class="flex flex-col gap-3">
                    
                    <!-- Citizen Card -->
                    <button onclick="selectRole('Citizen')" class="group w-full bg-white p-5 rounded-2xl flex items-center gap-4 border border-slate-200 shadow-sm transition-all duration-200 active:scale-[0.98] hover:border-brand-blue hover:shadow-md text-left">
                        <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-brand-light group-hover:text-brand-blue transition-colors">
                            <i class="fa-solid fa-mobile-screen-button text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-900 text-base">Citizen</h3>
                            <p class="text-xs font-medium text-slate-500 mt-1">Report hazards & view live maps</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-brand-blue transition-colors"></i>
                    </button>

                    <!-- Council Officer Card -->
                    <button onclick="selectRole('Council Officer')" class="group w-full bg-white p-5 rounded-2xl flex items-center gap-4 border border-slate-200 shadow-sm transition-all duration-200 active:scale-[0.98] hover:border-brand-blue hover:shadow-md text-left">
                        <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-brand-light group-hover:text-brand-blue transition-colors">
                            <i class="fa-solid fa-laptop-file text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-900 text-base">Council Officer</h3>
                            <p class="text-xs font-medium text-slate-500 mt-1">Triage reports & manage dispatch</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-brand-blue transition-colors"></i>
                    </button>

                    <!-- Field Crew Card -->
                    <button onclick="selectRole('Field Crew')" class="group w-full bg-white p-5 rounded-2xl flex items-center gap-4 border border-slate-200 shadow-sm transition-all duration-200 active:scale-[0.98] hover:border-brand-blue hover:shadow-md text-left">
                        <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-brand-light group-hover:text-brand-blue transition-colors">
                            <i class="fa-solid fa-helmet-safety text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-900 text-base">Field Crew</h3>
                            <p class="text-xs font-medium text-slate-500 mt-1">Receive tasks & submit closures</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-brand-blue transition-colors"></i>
                    </button>

                    <!-- Relief Desk Card -->
                    <button onclick="selectRole('Relief Desk')" class="group w-full bg-white p-5 rounded-2xl flex items-center gap-4 border border-slate-200 shadow-sm transition-all duration-200 active:scale-[0.98] hover:border-brand-blue hover:shadow-md text-left">
                        <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-brand-light group-hover:text-brand-blue transition-colors">
                            <i class="fa-solid fa-box-open text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-900 text-base">Relief Desk</h3>
                            <p class="text-xs font-medium text-slate-500 mt-1">Manage shelters & supplies</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-brand-blue transition-colors"></i>
                    </button>

                </div>
            </div>
            
            <!-- Bottom Spacer / App Version -->
            <div class="text-center mt-10 mb-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Expo SDK 57 • Build 2.0.1</p>
            </div>
        </div>

        <!-- Android Nav Bar Mockup -->
        <div class="h-10 w-full bg-transparent absolute bottom-0 flex justify-center pb-2">
            <div class="w-1/3 h-1.5 bg-slate-300 rounded-full"></div>
        </div>

    </div>

    <!-- Interactive script to simulate navigation -->
    <script>
        // Set dynamic clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simulate role selection click
        function selectRole(role) {
            alert(`Routing to ${role} interface...`);
            // In the real Expo app, this would be: router.push('/citizen/report')
        }
    </script>
</body>
</html>
